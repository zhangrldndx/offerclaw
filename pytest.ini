[pytest]
norecursedirs = output .claude .git .venv node_modules
markers =
    private_artifact: requires ignored local evaluation evidence and is opt-in
# [问题5] 已知第三方 deprecation——记录在案、不污染测试输出；后续通过依赖版本约束彻底处理。
# - starlette/httpx: fastapi.testclient 间接触发，待 fastapi/starlette 升级
# - pkg_resources: jieba 内部 import，待 jieba 升级或替换分词器
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:httpx.*
    ignore:.*pkg_resources is deprecated.*:UserWarning
